name: Build PyChrono runtimes

# Builds self-contained PyChrono runtime zips for BlendMotion
# (https://github.com/edccorp/BlendMotion) across Windows/Linux/macOS and
# Python 3.11/3.13 (Blender 4.1-5.0 bundle cp311; Blender 5.1 bundles cp313).
#
# Chrono sources are checked out from upstream projectchrono/chrono at the
# given ref; this branch (blendmotion-ci) only carries the CI scripts.

on:
  workflow_dispatch:
    inputs:
      chrono_ref:
        description: "projectchrono/chrono tag or sha to build"
        required: false
        default: "10.0.0"
        type: string
      release_tag:
        description: "If set (e.g. chrono-10.0.0-bm1), publish a release with the zips"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.plat }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        os: [windows-latest, ubuntu-22.04, macos-14]
        include:
          - os: windows-latest
            plat: win_amd64
          - os: ubuntu-22.04
            plat: linux_x86_64
          - os: macos-14
            plat: macos_arm64

    steps:
      - name: Checkout CI scripts (blendmotion-ci)
        uses: actions/checkout@v4

      - name: Checkout Chrono sources (upstream)
        uses: actions/checkout@v4
        with:
          repository: projectchrono/chrono
          ref: ${{ inputs.chrono_ref }}
          path: chrono
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compute python tag
        id: tags
        shell: bash
        run: echo "pytag=cp$(echo '${{ matrix.python }}' | tr -d '.')" >> "$GITHUB_OUTPUT"

      - name: Install build tools (swig, ninja, numpy)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # swig 4.3.1 matches the build the addon was developed against.
          # Fallback pin if SWIG codegen errors appear: swig==4.2.1
          pip install numpy "swig==4.3.1" ninja
          swig -version
          cmake --version

      - name: Install Eigen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Install Eigen (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen

      - name: Install Eigen (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o eigen.zip https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip
          unzip -q eigen.zip -d "$GITHUB_WORKSPACE/eigen"
          echo "EIGEN3_INCLUDE_DIR=$GITHUB_WORKSPACE/eigen/eigen-3.4.0" >> "$GITHUB_ENV"

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${EIGEN3_INCLUDE_DIR:-}" ]; then
            EXTRA="-DEIGEN3_INCLUDE_DIR=${EIGEN3_INCLUDE_DIR}"
          fi
          cmake -S chrono -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCH_ENABLE_MODULE_PYTHON=ON \
            -DCH_ENABLE_MODULE_VEHICLE=ON \
            -DCH_ENABLE_MODULE_VEHICLE_MODELS=ON \
            -DBUILD_DEMOS=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKING=OFF \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DSWIG_EXECUTABLE="$(python -c 'import shutil; print(shutil.which("swig"))')" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/chrono-install" \
            $EXTRA

      - name: Build
        shell: bash
        run: cmake --build build -j 4

      - name: Install
        shell: bash
        run: cmake --install build

      - name: Package runtime zip (+ smoke test)
        shell: bash
        run: |
          python ci/blendmotion/package_runtime.py \
            --install-dir "$GITHUB_WORKSPACE/chrono-install" \
            --plat "${{ matrix.plat }}" \
            --pytag "${{ steps.tags.outputs.pytag }}" \
            --license chrono/LICENSE \
            --out dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pychrono_runtime_${{ matrix.plat }}_${{ steps.tags.outputs.pytag }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release assets
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*.zip
          body: |
            PyChrono runtimes for BlendMotion, built from
            projectchrono/chrono @ ${{ inputs.chrono_ref }}.
